# Fabrique les fichiers à envoyer aux stores avec EAS Build (lancement manuel).
# Nécessite le secret EXPO_TOKEN. Pour iOS, les identifiants Apple doivent d'abord
# être enregistrés sur expo.dev (voir docs/PUBLICATION.md).
name: Build pour les stores

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plateforme
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Profil (preview = APK de test, production = stores)
        type: choice
        options: [production, preview]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Vérifie le secret EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifie le catalogue, les boîtes et la sauvegarde
        run: npm run verify
      - name: Relie le projet au compte Expo
        run: npx --yes eas-cli@latest init --force --non-interactive
      - name: Lance le build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: npx --yes eas-cli@latest build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
